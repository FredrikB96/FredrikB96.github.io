<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anki Vocab Quiz</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Anki-Style Japanese Vocab Quiz</h1>
        <div id="counts">
            <div id="statsToggleWrapper">
                <button id="toggleStatsBtn">📊 Show Stats</button>
                <div id="perModeStats" class="hidden">
                    <p>New Cards & Reviews this Session (by mode):</p>
                    <ul>
                        <li>
                            EN → Kanji: <span id="mode1Count">0</span>/<span id="mode1Max">10</span>
                            | Reviews: <span id="mode1ReviewCount">0</span>/<span id="mode1ReviewMax">100</span>
                        </li>
                        <li>
                            Kanji → Reading: <span id="mode2Count">0</span>/<span id="mode2Max">10</span>
                            | Reviews: <span id="mode2ReviewCount">0</span>/<span id="mode2ReviewMax">100</span>
                        </li>
                        <li>
                            Kanji → English: <span id="mode3Count">0</span>/<span id="mode3Max">10</span>
                            | Reviews: <span id="mode3ReviewCount">0</span>/<span id="mode3ReviewMax">100</span>
                        </li>
                        <li>
                            Sentence → Translation: <span id="mode4Count">0</span>/<span id="mode4Max">10</span>
                            | Reviews: <span id="mode4ReviewCount">0</span>/<span id="mode4ReviewMax">100</span>
                        </li>
                    </ul>
                </div>
            </div>
            <input type="file" id="csvFile" accept=".csv,.txt"/>
            <label for="deckSelector">📚 Select Deck:</label>
            <select id="deckSelector">
                <option value="N5">N5</option>
                <option value="N4">N4</option>
                <option value="N3">N3</option>
                <option value="N2">N2</option>
                <option value="N1">N1</option>
                <option value="Core">N1+</option>
                <option value="ALL" selected>ALL</option>
            </select>
            <button id="loadDefaultBtn">📂 Load Deck</button>
        </div>
        <div class="controls">
			<div id="ModeSelector">
            <label>
                Quiz Mode:
                <select id="quizMode">
                    <option value="random">🎲 Random</option>
                    <option value="1">English → Kanji</option>
                    <option value="2">Kanji → Reading</option>
                    <option value="3">Kanji → English</option>
					<option value="4">Sentence -> Translation </option>
                </select>
            </label>
			<label id="directionWrapper" class="hidden">
                Direction:
                <select id="direction">
                    <option value="jp-en">JP → EN</option>
                    <option value="en-jp">EN → JP</option>
                </select>
            </label>
			</div>
			<div>
            <label>
                Show Reading + Grammar
                <input type="checkbox" id="showHints" />
            </label>

            <label>
                Show Example Sentence
                <input type="checkbox" id="showExample" />
            </label>
			</div>
        </div>

        <div id="quizSection" class="hidden">
            <div id="question" class="question-box"></div>
            <div id="choices" class="choices-container"></div>
            <div id="hints" class="hidden"></div>
            <div id="example" class="hidden"></div>
            <button id="nextBtn" class="hidden">Next</button>
        </div>
    </div>

    <div id="ScheduleSettings">
        <h3>Backup & Restore</h3>
        <button id="downloadBackupBtn">📥 Export Progress</button>
        <input type="file" id="uploadBackupInput" accept=".json" />
        <label for="uploadBackupInput" class="upload-label">📤 Import Progress</label>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
